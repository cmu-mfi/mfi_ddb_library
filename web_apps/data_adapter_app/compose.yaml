services:
  frontend:
    build:
      context: .
      dockerfile: dockerfile-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - backend
    

  backend:
    build:
      context: .
      dockerfile: dockerfile-backend
    ports:
      - "8000:8000"
    restart: always
    