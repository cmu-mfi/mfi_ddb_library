services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    restart: always
    depends_on:
      - backend


  backend:
    container_name: mfi-data-adapter-backend
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    restart: always

volumes:
  backend_data:
