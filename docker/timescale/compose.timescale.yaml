services:
  timescaledb-db:
    platform: linux/amd64
    image: timescale/timescaledb:latest-pg16
    container_name: mfi-timescaledb-db
    environment:
      - POSTGRES_USER=tsdb
      - POSTGRES_PASSWORD=timescale
      - POSTGRES_DB=ddb_ts
    ports:
      - "5432:5432"
    volumes:
      - ../.data/timescale_storage:/var/lib/postgresql/data
    profiles:
      - "ts"
      - "dbn"
    networks:
      - mfi_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsdb -d ddb_ts"]
      interval: 5s
      timeout: 5s
      retries: 5

  timescaledb-connector:
    platform: linux/amd64
    build:
      context: ../../mfi_ddb_database_nodes/timescaledb/connector
      dockerfile: Dockerfile
      tags:
        - cmumfi/mfi-ddb-timescaledb-connector:${VERSION:-latest}
        - cmumfi/mfi-ddb-timescaledb-connector:latest
    container_name: mfi-timescaledb-connector
    image: cmumfi/mfi-ddb-timescaledb-connector:${VERSION:-latest}
    profiles:
      - "ts"
      - "dbn"
    depends_on:
      mqtt-broker:
        condition: service_started
      timescaledb-db:
        condition: service_healthy
    volumes:
      - ./connector-config.yaml:/app/config.yaml:ro
    networks:
      - mfi_network
    restart: on-failure

  timescaledb-dws:
    platform: linux/amd64
    build:
      context: ../../mfi_ddb_database_nodes/timescaledb/dws
      dockerfile: Dockerfile
      tags:
        - cmumfi/mfi-ddb-timescaledb-dws:${VERSION:-latest}
        - cmumfi/mfi-ddb-timescaledb-dws:latest
    container_name: mfi-timescaledb-dws
    image: cmumfi/mfi-ddb-timescaledb-dws:${VERSION:-latest}
    profiles:
      - "ts"
      - "dbn"
    ports:
      - "50052:50051"
    depends_on:
      timescaledb-db:
        condition: service_healthy
    volumes:
      - ./dws-config.yaml:/app/config.yaml:ro
    networks:
      - mfi_network
    restart: always