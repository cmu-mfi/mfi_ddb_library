services:
  blob-connector:
    platform: linux/amd64
    build:
      context: ../../mfi_ddb_database_nodes/blob/connector
      dockerfile: Dockerfile
      tags:
        - cmumfi/mfi-ddb-blob-connector:${VERSION:-latest}
        - cmumfi/mfi-ddb-blob-connector:latest
    container_name: mfi-blob-connector
    image: cmumfi/mfi-ddb-blob-connector:${VERSION:-latest}
    profiles:
      - "blob"
      - "dbn"
    volumes:
      - ../.data/blob_storage:/data/blob_storage
      - ./connector-config.yaml:/app/config.yaml:ro
    networks:
      - mfi_network
    restart: on-failure

  blob-dws:
    platform: linux/amd64
    build:
      context: ../../mfi_ddb_database_nodes/blob/dws
      dockerfile: Dockerfile
      tags:
        - cmumfi/mfi-ddb-blob-dws:${VERSION:-latest}
        - cmumfi/mfi-ddb-blob-dws:latest
    container_name: mfi-blob-dws
    image: cmumfi/mfi-ddb-blob-dws:${VERSION:-latest}
    profiles:
      - "blob"
      - "dbn"
    ports:
      - "50053:50053"
    depends_on:
      - blob-connector
    volumes:
      - ../.data/blob_storage:/data/blob_storage:ro
      - ./dws-config.yaml:/app/config.yaml:ro
    networks:
      - mfi_network
    restart: always