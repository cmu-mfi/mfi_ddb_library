version: '3.8'

networks:
  mfi_network:
    driver: bridge

volumes:
  timescale_storage:
  kv_psql_storage:
  mds_storage:
  emqx_data:
  emqx_log:

services:
  # SHARED INFRASTRUCTURE

  # Broker using Eclipse Mosquitto
  # mqtt-broker:
  #   platform: linux/amd64
  #   image: eclipse-mosquitto:2
  #   container_name: mfi-mqtt-broker
  #   ports:
  #     - "1883:1883"
  #   command: mosquitto -c /mosquitto/config/mosquitto.conf --allow-anonymous true
  #   networks:
  #     - mfi_network
  #   restart: always
  
  # Broker using EMQX
  mqtt-broker:
    platform: linux/amd64
    image: emqx/emqx:5.8
    container_name: mfi-mqtt-broker
    ports:
      - "1883:1883"     # MQTT TCP port
      - "8083:8083"     # MQTT websockets port (for web clients)
      - "18083:18083"   # EMQX dashboard UI
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    environment:
      - EMQX_NAME=mfi_broker
      - EMQX_HOST=127.0.0.1
    networks:
      - mfi_network
    restart: always

  # NODE 1: TIMESCALEDB (Historian Engine)
  timescaledb-db:
    platform: linux/amd64
    image: timescale/timescaledb:latest-pg16
    container_name: mfi-timescaledb-db
    environment:
      - POSTGRES_USER=tsdb
      - POSTGRES_PASSWORD=timescale
      - POSTGRES_DB=ddb_ts
    ports:
      - "5432:5432"
    volumes:
      - timescale_storage:/var/lib/postgresql/data
      - ./src/mfi_ddb/databases/timescaledb/init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
    networks:
      - mfi_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsdb -d ddb_ts"]
      interval: 5s
      timeout: 5s
      retries: 5

  timescaledb-connector:
    platform: linux/amd64
    build:
      context: .
      dockerfile: src/mfi_ddb/databases/timescaledb/connector/Dockerfile
    container_name: mfi-timescaledb-connector
    depends_on:
      mqtt-broker:
        condition: service_started
      timescaledb-db:
        condition: service_healthy
    networks:
      - mfi_network
    restart: on-failure

  timescaledb-dws:
    platform: linux/amd64
    build:
      context: .
      dockerfile: src/mfi_ddb/databases/timescaledb/dws/Dockerfile
    container_name: mfi-timescaledb-dws
    ports:
      - "50052:50052"
    depends_on:
      timescaledb-db:
        condition: service_healthy
    networks:
      - mfi_network
    restart: always

  # NODE 2: KV-POSTGRES (Metadata Engine)
  kv-psql-db:
    platform: linux/amd64
    image: postgres:15-alpine
    container_name: mfi-kv-psql-db
    environment:
      - POSTGRES_USER=mfi
      - POSTGRES_PASSWORD=mfiddb
      - POSTGRES_DB=mfi_kv
    ports:
      - "5431:5432"
    volumes:
      - kv_psql_storage:/var/lib/postgresql/data
    networks:
      - mfi_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mfi -d mfi_kv"]
      interval: 5s
      timeout: 5s
      retries: 5

  kv-psql-connector:
    platform: linux/amd64
    build:
      context: .
      dockerfile: src/mfi_ddb/databases/kv-psql/connector/Dockerfile
    container_name: mfi-kv-psql-connector
    depends_on:
      mqtt-broker:
        condition: service_started
      kv-psql-db:
        condition: service_healthy
    networks:
      - mfi_network
    restart: on-failure

  kv-psql-dws:
    platform: linux/amd64
    build:
      context: .
      dockerfile: src/mfi_ddb/databases/kv-psql/dws/Dockerfile
    container_name: mfi-kv-psql-dws
    ports:
      - "50051:50051"
    depends_on:
      kv-psql-db:
        condition: service_healthy
    networks:
      - mfi_network
    restart: always

  # NODE 3: METADATA STORE RELATIONAL ECOSYSTEM
  metadata-store-db:
    platform: linux/amd64
    image: postgres:15-alpine
    container_name: mfi-metadata-store-db
    environment:
      - POSTGRES_USER=mfi
      - POSTGRES_PASSWORD=mfiddb
      - POSTGRES_DB=mds
    ports:
      - "5430:5432"
    volumes:
      - mds_storage:/var/lib/postgresql/data
    networks:
      - mfi_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mfi -d mds"]
      interval: 5s
      timeout: 5s
      retries: 5

  metadata-store-connector:
    platform: linux/amd64
    build:
      context: .
      dockerfile: src/mfi_ddb/retrieval_api/metadata_store_pg/Dockerfile
    container_name: mfi-metadata-store-connector
    depends_on:
      mqtt-broker:
        condition: service_started
      metadata-store-db:
        condition: service_healthy
    networks:
      - mfi_network
    restart: on-failure