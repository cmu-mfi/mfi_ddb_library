name: Publish Releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pypi-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mfi_ddb_package

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag ref
        run: |
          if ! [[ "${{ github.ref_name }}" =~ ^v ]]; then
            echo "::error::Release workflow must run from a tag ref (got '${{ github.ref_name }}'). Use workflow_dispatch from a tag."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Add build metadata
        run: . update-build.sh

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        run: uv publish --token ${{ secrets.PYPI_TOKEN }}

  docker-release:
    needs: pypi-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Compose Images
        env:
          GITHUB_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${GITHUB_VERSION#v}"
          export VERSION

          echo "Building version: $VERSION"

          cd docker
          docker compose --profile '*' build --no-cache
          docker compose --profile '*' push
          
  github-release:
    needs: [docker-release, pypi-release]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          token: ${{secrets.SHOBHITAGG_PAT}}

      - name: Archive docker directory
        run: |
          tar czf docker.tar.gz docker
          zip -r docker.zip docker

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            docker.tar.gz
            docker.zip