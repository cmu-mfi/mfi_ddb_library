name: Sync Dev to Main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-dev-to-main:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SHOBHITAGG_PAT }}
          ref: main
          fetch-depth: 0       

      - name: Configure Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches and tags
        run: |
          git fetch --all

      - name: Check for version tag in dev branch
        id: check_tag
        run: |
          # Check if dev branch has a tag matching version pattern (e.g., v1.0.0)
          TAG=$(git log origin/dev --pretty=format:"%D" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          if [ -z "$TAG" ]; then
            echo "No version tag found in dev branch. Skipping sync."
            exit 1
          else
            echo "Found version tag: $TAG"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Sync dev to main
        if: steps.check_tag.outcome == 'success'
        run: |
          # Update main with dev branch changes
          git merge origin/dev --no-edit
          
          # Push the updated main branch
          git push origin main
