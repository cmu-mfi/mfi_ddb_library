name: MFI-DDB Package CI Checks

on:
  push:
    branches: [ dev ]
  pull_request:
    paths:
      - 'mfi_ddb_package/src/**'
      - 'mfi_ddb_package/tests/**'
      - 'mfi_ddb_package/pyproject.toml'
      - 'mfi_ddb_package/.pre-commit-config.yaml'
  workflow_dispatch:

jobs:
  # JOB 0: Lint and format check with ruff (mirrors the pre-commit hooks)
  lint-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mfi_ddb_package

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  # JOB 1: Installation across multiple OSes
  installation-check:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mfi_ddb_package    

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

  # JOB 2: Run data adapter streaming tests with EMQX broker
  streaming-check:
    needs: installation-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mfi_ddb_package    

    services:
      emqx:
        image: emqx/emqx:5.10.2
        ports:
          - 1883:1883
          - 18083:18083        
        options: >-
          --health-cmd "curl --fail http://127.0.0.1:18083/api/v5/status || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --add-host emqx:127.0.0.1

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          git submodule update --init --recursive
          uv sync --locked --all-extras --dev

      - name: Run tests for LocalFilesDataAdapter
        run: uv run pytest tests/data_adapters/test_local_files_adapter.py -v --tb=short

      - name: Run tests for MQTTDataAdapter
        run: uv run pytest tests/data_adapters/test_mqtt_adapter.py -v --tb=short

      - name: Run tests for KvDataAdapter
        run: uv run pytest tests/data_adapters/test_kv_adapter.py -v --tb=short


  # JOB 3: Run ROS2 tests
  ros2-check:
    needs: installation-check
    uses: ./.github/workflows/ros2.yaml

  # JOB 4: PR auto-fix via pre-commit hooks (commit any automatic fixes back to the PR branch)
  pre-commit-check:
    needs: lint-check
    runs-on: ubuntu-latest
    # NOTE: Run from repo root so that .pre-commit-config.yaml patterns (which reference
    # "mfi_ddb_package/") resolve correctly. The config is invoked via explicit paths below.

    permissions:
      contents: write

    steps:
      - name: Checkout with full history for push back to branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install pre-commit via uv tool
        run: uv tool install pre-commit          

      - name: Install hooks from project-local config
        # Use the full path to the config file (located in mfi_ddb_package/)
        run: pre-commit install --config mfi_ddb_package/.pre-commit-config.yaml

      - name: Run full pre-commit suite (with automatic fixes)
        env:
          PY_COLORS: "1"
          PRE_COMMIT_NO_INTERACTION: "1"
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          pre-commit run --all-files --config mfi_ddb_package/.pre-commit-config.yaml || true
          pre-commit run --all-files --config mfi_ddb_package/.pre-commit-config.yaml

      - name: Commit and Push generated files
        # Ref: https://github.com/marketplace/actions/git-auto-commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "CI: apply pre-commit auto-fixes"
          file_pattern: "*"
          branch: ${{ github.head_ref || github.ref_name }}
