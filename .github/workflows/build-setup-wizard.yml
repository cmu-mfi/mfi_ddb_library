name: Build Setup Wizard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'setup-wizard/**'
      - '.github/workflows/build-setup-wizard.yml'
  push:
    branches: [main]
    paths:
      - 'setup-wizard/**'
      - '.github/workflows/build-setup-wizard.yml'

permissions:
  contents: read

concurrency:
  group: setup-wizard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            extension: AppImage
          - os: windows-2022
            platform: win
            arch: x64
            extension: exe
          - os: macos-15
            platform: mac
            arch: arm64
            extension: dmg
          - os: macos-15-intel
            platform: mac
            arch: x64
            extension: dmg
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # Build the Python backend and Electron app for the same native architecture.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: setup-wizard/backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: setup-wizard/ui/package-lock.json

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install backend build dependencies
        run: python -m pip install -r setup-wizard/backend/requirements.txt pyinstaller

      - name: Install UI dependencies
        working-directory: setup-wizard/ui
        run: npm ci

      - name: Build installer
        working-directory: setup-wizard/ui
        run: npm run electron:build -- --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: setup-wizard-${{ matrix.platform }}-${{ matrix.arch }}
          path: setup-wizard/ui/dist/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
