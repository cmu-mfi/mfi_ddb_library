name: ROS2 Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'mfi_ddb_package/src/**'
  workflow_dispatch:
  workflow_call:

jobs:
  ros2check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mfi_ddb_package    

    container:
      image: ros:jazzy

    services:
      emqx:
        image: emqx/emqx:5.10.2
        ports:
          - 1883:1883
          - 18083:18083

    steps:
      - uses: actions/checkout@v5

      - name: Install ROS2 system dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y \
            curl \
            python3-pip \
            python3-lark \
            ros-jazzy-demo-nodes-cpp \
            ros-jazzy-launch-testing

      - name: Uninstall unnecessary ROS pytest plugins
        shell: bash
        run: |
          pip uninstall -y launch-testing launch-ros ament-flake8 ament-xmllint ament-lint ament-pep257 ament-copyright colcon-core-warnings-stderr 2>/dev/null || true

      - name: Install uv
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Start ROS2 talker
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          nohup ros2 run demo_nodes_cpp talker > talker.log 2>&1 &
          sleep 5   

      - name: Run ROS2 tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          uv run pytest tests/data_adapters/test_ros2_adapter.py --tb=short
