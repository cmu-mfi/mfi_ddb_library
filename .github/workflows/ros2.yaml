name: ROS2 Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  ros2check:
    runs-on: ubuntu-latest

    container:
      image: ros:jazzy

    services:
      emqx:
        image: emqx/emqx:5.10.2
        ports:
          - 1893:1883
          - 18093:18083

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y \
            curl \
            python3-pip \
            ros-jazzy-demo-nodes-cpp \
            ros-jazzy-launch-testing

      - name: Install uv
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Install lark in virtual environment
        run: uv add lark

      - name: Start ROS talker
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          nohup ros2 run demo_nodes_cpp talker > talker.log 2>&1 &
          sleep 5   

      - name: Run tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          uv run pytest tests/data_adapters/test_ros2_adapter.py --tb=short