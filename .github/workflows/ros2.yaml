name: ROS2 Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'mfi_ddb_package/src/**'
  workflow_dispatch:
  workflow_call:

jobs:
  ros2check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mfi_ddb_package    

    container:
      image: ros:jazzy
      
    services:
      emqx:
        image: emqx/emqx:5.10.2
        ports:
          - 1883:1883
          - 18083:18083
        options: >-
          --health-cmd "curl --fail http://127.0.0.1:18083/api/v5/status || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --add-host emqx:127.0.0.1      

    steps:
      - uses: actions/checkout@v5

      # Optimization 1: Combined apt steps and cleared cache to save space/time
      - name: Install ROS2 system dependencies
        shell: bash
        run: |
          apt-get update && apt-get install -y \
            curl \
            python3-pip \
            python3-lark \
            ros-jazzy-demo-nodes-cpp
        # && rm -rf /var/lib/apt/lists/*

      # Optimization 2: Use the official setup-uv action (includes automatic caching)
      - name: Install uv
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Optimization 3: Pass --system-site-packages so uv can see your ROS2 installation
      - name: Install dependencies
        run: |
          git submodule update --init --recursive
          uv sync --locked --all-extras --dev

      # - name: Change pytest version
      #   run: uv add --dev "pytest<=8.0"

      - name: Start ROS2 talker
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          nohup ros2 run demo_nodes_cpp talker > talker.log 2>&1 &
          sleep 5   

      - name: Run ROS2 tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          uv run pytest tests/data_adapters/test_ros2_adapter.py --tb=short