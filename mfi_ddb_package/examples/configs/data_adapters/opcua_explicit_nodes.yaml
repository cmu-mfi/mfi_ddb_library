# OPC UA data adapter - explicit nodes instead of whole-server auto-discovery.
# Tip: generate a starting `nodes` list from a live server with
#   python -m mfi_ddb.scripts.opcua_discover --endpoint opc.tcp://192.168.1.10:4840 -o nodes.yaml
adapter_name: my_opcua_adapter
trial_id: trial_001
opcua:
  endpoint: opc.tcp://192.168.1.10:4840
  username: operator          # optional
  password: change_me         # optional
  # security_string: Basic256Sha256,SignAndEncrypt,client_cert.der,client_key.pem
  publishing_interval: 500    # ms
  health_check_interval: 5    # s, reconnect + resubscribe if the server is lost
discovery:
  # limits also apply to `browse_root` entries below
  max_depth: 5
  max_nodes: 500
  exclude:
  - Diagnostics
attributes:
  location: cell-1
nodes:
# a single variable, stored under `key`
- component_id: robot-arm-1
  node_id: ns=2;s=RobotArm1.Temperature
  key: temperature
# every variable below an object, keyed by browse path (e.g. Motor/RPM)
- component_id: machine-a
  browse_root: ns=2;s=MachineA
  trial_id: trial_002
