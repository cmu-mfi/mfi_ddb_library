[project]
name = "mfi_ddb"
version = "1.0.0"
description = "MFI DDB: Python library for streaming data"
readme = "README.md"
requires-python = ">=3.8,<3.13"
maintainers = [
    { name="Shobhit Aggarwal", email="shobhit@cmu.edu" },
    { name="Stephanie Steren-Ruta", email="ssterenr@andrew.cmu.edu" }
]
license = "BSD-3-Clause"
dependencies = [
    "cmake>=4.0.3",
    "grpcio>=1.70.0",
    "grpcio-tools>=1.70.0",
    "jsonschema>=4.23.0",
    "lark>=1.1.9",
    "numpy>=1.24.4",
    "omegaconf>=2.3.0",
    "open3d>=0.19.0",
    "opencv-python-headless>=5.0.0.93",
    "paho-mqtt>=2.1.0",
    "pandas>=2.0.3",
    "ping3>=4.0.8",
    "protobuf>=5.29.5",
    "pydantic>=2.10.6",
    "pyyaml>=6.0.2",
    "requests>=2.32.4",
    "rospkg>=1.6.0",
    "setuptools>=75.3.2",
    "watchdog>=4.0.2",
    "wheel>=0.45.1",
    "xmltodict>=0.14.2",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest<=8.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = [
    "notebooks",
    "**/*_pb2.py",
    "**/*.ipynb"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# UP (pyupgrade) may rewrite code in ways that break 3.8 compat; keep it conservative.
ignore = [
    "UP007",  # use `X | Y` type annotations (PEP 604) - requires 3.10+
    "UP045",  # use `X | None` - requires 3.10+
    "F405",
    "F403",
    "F821",
    "SIM115"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # allow long lines in tests

[tool.ruff.format]
line-ending = "lf"
